# Copy to /etc/nginx/sites-available/elia; replace elia.example.com with your real domain.
# First set DNS A record; then obtain TLS certificate using certbot --nginx.
server {
    listen 80;
    server_name elia.example.com;
    client_max_body_size 32m;

    # Specific rate limit for local session login. Install 00-elia-login-limit.conf
    # under /etc/nginx/conf.d/ (http scope) before enabling this site.
    location = /api/auth/login {
        limit_req zone=elia_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3401;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_elia_internal/ {
        internal;
        alias /srv/elia/media/;
        types { video/mp4 mp4; image/jpeg jpg jpeg; image/png png; image/webp webp; }
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3401;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
